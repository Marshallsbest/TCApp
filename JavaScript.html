<script type="text/javascript">
/**
 *  Funciton clearForm
 *  description: clears all fields with in the form to ""
 * 
 */  
  function clearForm(){
    const addDat  = document.getElementById("addDateCheck");
      if (addDat.checked) {
        addDat.click();
      };
    const addTime = document.getElementById("manuallyAddTime");
      if (addTime.checked) {

      };
    const worSrt = document.getElementById("startTime");
    const worStp = document.getElementById("stopTime");
    console.log("worStp was ready next is worOrd");
    const worOrd = document.getElementById("workOrder");
    const ordDat = document.getElementById("orderDate");
    const cusSel = document.getElementById("customerSelect");
    const cusNam = document.getElementById("customerName");
    const macSel = document.getElementById("machineSelect");
    const macNam = document.getElementById("machineName");
    const logEnt = document.getElementById("logEntry");
    const catSel = document.getElementById("categorySelect");
    const catNam = document.getElementById("categoryName");

/**
 * Funciton onSuccess - handles the callback from a successful server call  
 * 
 * @param {string} message - the returned message data confirmation 
 */
  function onSuccess(message){
    console.log("onSuccess was called! Message was: "+message);
    clearForm();
    window.scrollTo(0,0); 
    let div = document.getElementById("output");
    let addAnother = document.getElementById("logButton");
    addAnother.innerHTML = "Add Another Entry";
    div.innerHTML = "";
    setFocusToTextBox("categorySelect");
    checkOption("reset","reset");
    spinner("remove");
    return
  };
</script>
<script>

function spinner(option){
  let spinnerVisible = document.getElementById("spinner");      
  if(option === "remove"){

    }else{
      spinnerVisible.classList.add("is-active");

<script>
  function calcTime(value,id){
    const startValue = document.getElementById("startTime").value;
    let startTime = new Date(startValue).getTime()
    const stopValue = document.getElementById("stopTime").value;
    let endTime = new Date(stopValue).getTime();
    if(!startTime || !endTime){
    }else if(endTime > startTime){
      let msDiff = (endTime - startTime);
      const sec = 1000;
      let tMs = Math.floor(msDiff % sec);
      let diff = msDiff - tMs;
      const min = sec * 60;
      const dMin = 10 * min;
      let qHr = 15 * min;  
      const hr = 60 * min; 
      let tMin = diff>hr ? Math.floor((diff%hr)/min) : Math.floor(diff/min);
      let tQhr = diff>= qHr ? Math.floor((diff%hr)/qHr) : "0";
      let display = tQhr *25;
      let decMin = diff>=dMin ? Math.floor((diff%hr)/dMin) : "0";
      let sMin = diff>=dMin ? Math.floor(tMin-(decMin*10)) : Math.floor((diff%dMin)/min);
      let tHrs = diff>hr ? Math.floor(diff/hr) : "00";
      let timeSpent = tHrs+"."+display;
      document.getElementById("totalHours").value = timeSpent;
    };
  };
</script>
